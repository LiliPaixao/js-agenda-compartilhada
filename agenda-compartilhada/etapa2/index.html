<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Compartilhada</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- aplica o tema salvo antes da primeira pintura, para não piscar -->
    <script src="tema.js"></script>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="tema-switch" role="group" aria-label="Escolher tema visual" data-theme-switch>
        <button type="button" data-theme-choice="planner">Planner</button>
        <button type="button" data-theme-choice="boho">Boho</button>
        <button type="button" data-theme-choice="editorial">Editorial</button>
    </div>

    <main class="planner">
        <header>
            <h1 class="planner__titulo">Agenda Compartilhada</h1>
            <p class="planner__subtitulo">Planner 2026</p>
            <hr class="planner__regua">
        </header>

        <div id="calendario"></div>
    </main>

    <div id="modal">
        <form>
            <h3 class="modal__titulo">Evento</h3>
            <label> Título:
                <input type="text"
                name="title"
                />
            </label>
            <label> Hora:
                <input type="time"
                name="event_time"
                />
            </label>
            <label> Data
                <input type='date'
                name="event_date"
                />
            </label>
            <button id="btn-salvar" type="button">
                Salvar
            </button>
        </form>
    </div>

    <footer class="credito">
  Feito por Liliane Paixão ·
  <a href="https://github.com/LiliPaixao" target="_blank" rel="noopener">GitHub</a> ·
  <a href="https://www.linkedin.com/in/lilianepaixao/" target="_blank" rel="noopener">LinkedIn</a>
  <a href="https://www.flaticon.com/uicons" target="_blank" rel="noopener">Uicons by Flaticon</a>
</footer>

    <script src="../agenda.js"></script>
</body>

</html>
