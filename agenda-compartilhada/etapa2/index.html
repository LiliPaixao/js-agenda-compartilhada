<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #calendario{
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            max-width: 700px;
            margin: 20px auto;
        }

        #calendario div {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px;
            min-height: 60px;
            text-align: center;
            font-family: sans-serif;
        }

        #calendario .cabecalho {
            grid-column: 1 / -1;
        }

        #calendario div.highlight {
            background-color: #e0e0e0;
        }
        #modal {
            display: none;
        }

        @media (max-width: 400px) {
            #calendario{
                grid-template-columns: repeat(1, 1fr);
            }
        }
    </style>

</head>
<body>
    <div id="calendario"></div>
    <div id="modal">
        <form>
            <label> Título:
                <input type="text"
                name="title"
                />
            </label>
            <label> Hora:
                <input type="time"
                name="event_time"
                />
            </label>
            <label> Data
                <input type='date'
                name="event_date"
                />
            </label>
            <button id="btn-salvar" type="button">Salvar
            </button> 
        </form>
    </div>

    <script src="../agenda.js"></script>
</body>

</html>
